<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Kopija</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Excel Kopija</h1>

    <div class="controls">
        <button id="clearBtn">Išvalyti pasirinktą langelį</button>
        <button id="clearAllBtn">Išvalyti visus langelius</button>
        <span id="cellInfo">Pasirinkite langelį</span>
    </div>

    <div class="grid-wrapper">
        <div class="row-numbers" id="rowNumbers"></div>
        <div class="grid-container" id="excelGrid"></div>
    </div>

    <div class="image-section">
        <img src="images/Microsoft_Excel-Logo.wine.svg">
        <p>© 2025 EXCEL. All rights reserved.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
